# Nixpacks configuration for LeagueHub
# Forces detection of Node.js project (Coolify / Nixpacks)

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs-20_x", "openssl"]

[phases.install]
cmds = ["npm ci --prefer-offline --no-audit --progress=false"]

[phases.build]
cmds = [
  "npx prisma generate",
  "npx prisma db push --skip-generate --accept-data-loss",
  "npm run build"
]

[start]
cmd = "npm run start"
