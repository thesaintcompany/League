# Nixpacks configuration for LeagueHub (Coolify / Nixpacks)
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci --legacy-peer-deps || npm install --legacy-peer-deps"]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "node prisma/bootstrap.js && (test -f server.js && node server.js || npx next start)"
